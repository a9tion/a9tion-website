<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>スタッフ認証 | a9tion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: #f2f2f7; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    .wrap { width: 100%; max-width: 340px; text-align: center; }

    .logo {
      font-size: 13px; font-weight: 700; letter-spacing: 0.15em;
      color: #888; text-transform: uppercase; margin-bottom: 8px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #1c1c1e; margin-bottom: 6px; }
    .sub { font-size: 14px; color: #8e8e93; margin-bottom: 36px; }

    .pin-display {
      display: flex; gap: 18px; justify-content: center;
      margin-bottom: 12px;
    }
    .pin-dot {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid #c7c7cc; transition: all 0.15s;
    }
    .pin-dot.filled { background: #1c1c1e; border-color: #1c1c1e; }
    .pin-display.shake { animation: shake 0.38s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-8px); }
      40%     { transform: translateX(8px); }
      60%     { transform: translateX(-6px); }
      80%     { transform: translateX(6px); }
    }

    .error-msg {
      font-size: 13px; color: #ff3b30; font-weight: 500;
      min-height: 20px; margin-bottom: 28px; opacity: 0; transition: opacity 0.2s;
    }
    .error-msg.show { opacity: 1; }

    .numpad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px; max-width: 280px; margin: 0 auto;
    }
    .num-btn {
      height: 74px; border-radius: 50%; border: none;
      background: white; font-size: 26px; font-weight: 400;
      color: #1c1c1e; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .num-btn:active { background: #d1d1d6; }
    .num-btn.del { font-size: 20px; background: #e5e5ea; }
    .num-btn.del:active { background: #c7c7cc; }
    .num-btn.blank { background: transparent; box-shadow: none; pointer-events: none; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="logo">a9tion</div>
  <h1>スタッフ認証</h1>
  <p class="sub">あなたのPINを入力してください</p>

  <div class="pin-display" id="pin-display">
    <!-- dots are generated by JS based on PIN_LENGTH -->
  </div>
  <p class="error-msg" id="error-msg">PINが正しくありません</p>

  <div class="numpad">
    <button class="num-btn" onclick="pressKey('1')">1</button>
    <button class="num-btn" onclick="pressKey('2')">2</button>
    <button class="num-btn" onclick="pressKey('3')">3</button>
    <button class="num-btn" onclick="pressKey('4')">4</button>
    <button class="num-btn" onclick="pressKey('5')">5</button>
    <button class="num-btn" onclick="pressKey('6')">6</button>
    <button class="num-btn" onclick="pressKey('7')">7</button>
    <button class="num-btn" onclick="pressKey('8')">8</button>
    <button class="num-btn" onclick="pressKey('9')">9</button>
    <button class="num-btn blank"></button>
    <button class="num-btn" onclick="pressKey('0')">0</button>
    <button class="num-btn del" onclick="pressDelete()">⌫</button>
  </div>
</div>

<script>
// ============================================================
// PINマップ設定（案件ごとに編集してください）
// 'PIN番号': 'スタッフ名'
// ============================================================
const PIN_MAP = {
  '1234': 'Yuki',
  '5678': 'Taro',
  '9012': 'Kei',
};
const PIN_LENGTH = 4;
// ============================================================

const REDIRECT_DEFAULT = 'staff.html';
const AUTH_KEY = 'a9tion_auth';
const AUTH_TTL = 24 * 60 * 60 * 1000; // 24時間

// すでにログイン済みなら即リダイレクト
const existing = localStorage.getItem(AUTH_KEY);
if (existing) {
  try {
    const d = JSON.parse(existing);
    if (Date.now() - d.loginTime < AUTH_TTL) {
      gotoRedirect();
    } else {
      localStorage.removeItem(AUTH_KEY);
    }
  } catch(e) {
    localStorage.removeItem(AUTH_KEY);
  }
}

// PIN dot を生成
const pinDisplay = document.getElementById('pin-display');
for (let i = 0; i < PIN_LENGTH; i++) {
  const dot = document.createElement('div');
  dot.className = 'pin-dot';
  dot.id = 'dot-' + i;
  pinDisplay.appendChild(dot);
}

let entered = '';

function pressKey(k) {
  if (entered.length >= PIN_LENGTH) return;
  entered += k;
  document.getElementById('dot-' + (entered.length - 1)).classList.add('filled');
  if (entered.length === PIN_LENGTH) {
    setTimeout(verifyPin, 120);
  }
}

function pressDelete() {
  if (entered.length === 0) return;
  document.getElementById('dot-' + (entered.length - 1)).classList.remove('filled');
  entered = entered.slice(0, -1);
  hideError();
}

function verifyPin() {
  const name = PIN_MAP[entered];
  if (name) {
    localStorage.setItem(AUTH_KEY, JSON.stringify({ name, pin: entered, loginTime: Date.now() }));
    gotoRedirect();
  } else {
    showError();
    pinDisplay.classList.add('shake');
    setTimeout(() => {
      pinDisplay.classList.remove('shake');
      resetDots();
    }, 420);
  }
}

function resetDots() {
  entered = '';
  for (let i = 0; i < PIN_LENGTH; i++) {
    document.getElementById('dot-' + i).classList.remove('filled');
  }
}

function showError() {
  document.getElementById('error-msg').classList.add('show');
}
function hideError() {
  document.getElementById('error-msg').classList.remove('show');
}

function gotoRedirect() {
  const params = new URLSearchParams(location.search);
  const dest = params.get('redirect') || REDIRECT_DEFAULT;
  location.href = dest;
}

// 物理キーボード入力にも対応
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') pressKey(e.key);
  if (e.key === 'Backspace') pressDelete();
});
</script>
</body>
</html>
